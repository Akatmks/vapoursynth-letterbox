name: build
on: push

jobs:
  build:
    strategy:
      matrix:
        runner: ['windows-latest', 'ubuntu-latest', 'macos-latest', 'macos-26-intel']
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v7

    - uses: msys2/setup-msys2@v2
      with:
        msystem: CLANG64
        path-type: inherit
      if: ${{ runner.os == 'Windows' }}
    - uses: ZhongRuoyu/setup-llvm@v0
      if: ${{ (runner.os == 'Windows' && runner.arch == 'X64') || runner.os == 'Linux' }}
    - uses: ConorMacBride/install-package@v1
      with:
        brew: llvm lld
      if: ${{ runner.os == 'macOS' }}
    - uses: actions/setup-python@v7
      with:
        python-version: '3.13'
    - run: python -m pip install build meson meson-python ninja vapoursynth wheel
      shell: ${{ runner.os == 'Windows' && 'msys2 {0}' || 'bash' }}

    - run: CC=clang CXX=clang++ CFLAGS="-march=x86-64-v3 -mtune=znver2 -Werror" CXXFLAGS="-march=x86-64-v3 -mtune=znver2 -Werror" LDFLAGS="-fuse-ld=lld" python -m build --no-isolation
      shell: msys2 {0}
      if: ${{ runner.os == 'Windows' && runner.arch == 'X64' }}
    - run: CC=clang CXX=clang++ CFLAGS="-march=x86-64-v3 -mtune=znver2 -Werror" CXXFLAGS="-march=x86-64-v3 -mtune=znver2 -Werror" LDFLAGS="-fuse-ld=lld --rtlib=compiler-rt -Wl,-O3" python -m build --no-isolation
      shell: msys2 {0}
      if: ${{ runner.os == 'Linux' && runner.arch == 'X64' }}
    - run: CC=clang CXX=clang++ CFLAGS="-march=armv8.5-a+simd+crypto -mtune=apple-m3 -Werror" CXXFLAGS="-march=armv8.5-a+simd+crypto -mtune=apple-m3 -Werror" LDFLAGS="-fuse-ld=lld --rtlib=compiler-rt" python -m build --no-isolation
      shell: msys2 {0}
      if: ${{ runner.os == 'macOS' && runner.arch == 'ARM64' }}
    - run: CC=clang CXX=clang++ CFLAGS="-march=skylake -mtune=skylake -Werror" CXXFLAGS="-march=skylake -mtune=skylake -Werror" LDFLAGS="-fuse-ld=lld --rtlib=compiler-rt" python -m build --no-isolation
      shell: msys2 {0}
      if: ${{ runner.os == 'macOS' && runner.arch == 'X64' }}
    - run: python -m wheel tags --remove --python-tag py3 --abi-tag none dist/*.whl
      shell: ${{ runner.os == 'Windows' && 'msys2 {0}' || 'bash' }}

    - uses: actions/upload-artifact@v7
      with:
        name: '${{ runner.os }} ${{ runner.arch }}'
        path: dist/*.whl
